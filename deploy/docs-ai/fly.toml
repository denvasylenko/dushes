# formguide's public host: the docs site at /, Ask AI at /ai, the live demo at /demo (backend/docs_ai/host.py).
#   fly secrets set ANTHROPIC_API_KEY=... -a dushes-ai
#   fly deploy . --config deploy/docs-ai/fly.toml --dockerfile deploy/docs-ai/Dockerfile --ignorefile deploy/docs-ai/.dockerignore
app = "dushes-ai"
primary_region = "fra"

[env]
  DOCS_AI_MODEL = "anthropic:claude-haiku-5-5"
  DOCS_AI_PER_THREAD = "15"
  DOCS_AI_SITE_PER_DAY = "1000"
  DOCS_AI_PER_MINUTE = "6"
  DOCS_AI_PER_DAY = "60"
  DEMO_PER_THREAD = "15"
  DEMO_PER_IP_DAY = "60"
  DEMO_PER_DAY = "500"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/ai/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
