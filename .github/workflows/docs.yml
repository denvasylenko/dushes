name: Docs

# Checks the documentation site (specs, English, a full build of site/) on every change. The docs are served from
# https://dushes-ai.fly.dev (deploy/docs-ai/); GitHub Pages only redirects: every old /dushes/<page> address goes to
# the same page there, so nothing serves two copies.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "openspec/**", "packages/agui-chat/src/**", "scripts/check_english.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["site/**", "openspec/**", "packages/agui-chat/src/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            packages/agui-chat/package-lock.json
      - name: Validate specs
        run: npx --yes @fission-ai/openspec@1.17.0 validate --all --strict --no-interactive
      - name: English only
        run: python3 scripts/check_english.py
      - name: Install
        working-directory: site
        run: npm ci
      - name: Install the widget's dependencies (the site builds the widget from its sources, e.g. chart.js)
        working-directory: packages/agui-chat
        run: npm ci
      - name: Build site
        working-directory: site
        env:
          PUBLIC_ASK_AI_URL: ${{ vars.PUBLIC_ASK_AI_URL }}   # the docs assistant; unset = Ask AI offers Claude / ChatGPT
        run: npm run build
      - name: Redirect stub for GitHub Pages (every page -> the same page on the canonical host)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p pages
          cat > pages/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Dushes docs moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://dushes-ai.fly.dev/">
          <script>location.replace('https://dushes-ai.fly.dev' + location.pathname.replace(/^\/dushes/, '') + location.search + location.hash)</script>
          <p>The docs moved to <a href="https://dushes-ai.fly.dev/">dushes-ai.fly.dev</a>.</p>
          HTML
          cp pages/index.html pages/404.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
