name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "openspec/**", "scripts/build_docs_site.py", "scripts/check_english.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "openspec/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate specs
        run: npx --yes @fission-ai/openspec@1.17.0 validate --all --strict --no-interactive
      - name: English only
        run: python3 scripts/check_english.py
      - name: Build site
        run: python3 scripts/build_docs_site.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
