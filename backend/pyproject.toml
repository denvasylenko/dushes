[project]
name = "formguide"
version = "0.2.0"
description = "A chat agent that guides users through large configurable forms (LangGraph, AG-UI, CopilotKit)."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.0",
  "langchain>=1.4.0",
  "langchain-core>=1.7.0",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "pypdf>=7.0.1",
  "pillow>=11",            # shrinks phone photos before they go to the model
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7.10"]
openai = ["langchain-openai>=1.7.4"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.33", "ag-ui-protocol>=1.0.0"]
research = ["deepagents>=0.7.35"]
sqlite = ["langgraph-checkpoint-sqlite>=3.1.3", "aiosqlite>=0.20"]
otel = ["opentelemetry-sdk>=1.40", "opentelemetry-exporter-otlp>=1.40"]
otel-zipkin = ["formguide[otel]", "opentelemetry-exporter-zipkin-json>=1.40"]
otel-azure = ["formguide[otel]", "azure-monitor-opentelemetry-exporter>=1.0.0b50"]
all = ["formguide[anthropic,openai,server,research,sqlite,otel]"]

[project.scripts]
formguide = "formguide.cli:main"

[project.urls]
Homepage = "https://github.com/denvasylenko/dushes"
Documentation = "https://denvasylenko.github.io/dushes/"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formguide"]

[tool.hatch.build.targets.sdist]
include = ["formguide", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "formguide[all]"]

[tool.pytest.ini_options]
pythonpath = ["."]
