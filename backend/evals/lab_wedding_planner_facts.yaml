name: lab_wedding_planner_facts
tags: [lab, facts]
persona: >-
  A groom-to-be comparing venues who wants a number: what a wedding for 100 guests with the ceremony on the estate
  would cost, how many guest rooms there are and how much a room costs per night (the page gives no room price).
