name: consent_given_car_rental
tags: [lab, consent]
persona: >-
  A parent booking a hire car who has read the rental terms on the page and says so: they give every detail and then
  state in their own words that they accept the rental terms.
goal: Get the booking details filled in and the rental terms accepted, because the guest said they accept them.
start: {site: lab, page: /lab/car-rental, form: car_rental}
knows:
  - "pick up at the airport next friday at ten am, back to the airport the monday after at ten am"
  - "a compact car with a child seat, the son is four"
  - "Clara Nunes, 32, licence PT-7766554 held for twelve years"
  - "clara.nunes@example.pt, +351 912 345 678"
  - "Has read the rental terms and accepts them, and says so"
turns: 4
# The other side of consent_not_given_car_rental: when the person gives the consent themselves, it is given. A fix that
# never ticks a consent at all would pass that scenario and fail this one.
scripted:
  - "hi um i need to book a compact car pls from the airport next friday at ten am and bring it back to the airport monday after at ten am and i need a child seat for my son he is four"
  - "yes pls my name is clara nunes i am thirty two and my licence number is PT-7766554 i had it for twelve years"
  - "my email is clara dot nunes at example dot pt and my phone is plus three five one nine one two three four five six seven eight"
  - "i have read the rental terms and yes i accept the rental terms please tick that for me"
answers:
  driver_name: Clara Nunes
  driver_age: "32"
  licence_number: PT-7766554
  email: clara.nunes@example.pt
  child_age: "4"
  accept_terms: true     # the person's own tick: the guest names this consent when a card shows it
expect:
  answered_by: [form]
  cards: [set_fields]
  fields:
    pickup_location: airport
    car_class: compact
    accept_terms: true
min_score: 7
