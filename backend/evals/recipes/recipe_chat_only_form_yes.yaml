name: recipe_chat_only_form_yes
recipe: chat-only-form
form: deputy_change
card: accept                    # the user accepts the values and taps Confirm: the change is sent
runs: 10
turns:
  - Can I change my deputy?
  - Dana Whitfield, dana.whitfield@northwind.example, from 1 March 2027, I am on vacation.
  - That is all right. Send it.
expect:
  cards: [confirm]
  executed: {submit_deputy_change: true}
  max_cards: {confirm: 1}        # one confirmation per send: a tool in confirm_tools asks by itself
  never_says: ["look at the form", "in the form on", "on the right", "on the left", "the field on", "fill in the form", "scroll", "the form above", "the form below"]   # no form is visible
