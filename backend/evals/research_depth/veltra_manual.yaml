# Researcher depth benchmark: the Veltra HX heat pump documentation (corpus demo/research_corpora/veltra_manual, invented).
# The manuals describe firmware 2.4; the release notes for 3.0 prevail for a unit on 3.0.
corpus: veltra_manual
title: Veltra HX heat pump documentation
scenarios:
  # ------------------------------------------------------------------ quick
  - id: vm_q_fuse
    group: quick
    kind: table
    role: "An electrician wiring an HX-35."
    wants: "The fuse rating."
    question: "What fuse does the HX-35 need?"
    points:
      - {say: "40 A, 400 V three-phase", keys: ["40"], where: installation_manual.pdf}
  - id: vm_q_refrigerant
    group: quick
    kind: fact
    role: "A facility manager filling in a refrigerant register."
    wants: "The refrigerant of the HX units."
    question: "Which refrigerant do the HX heat pumps use?"
    points:
      - {say: "R-290 (propane)", keys: ["R-290", "R290", "propane"], where: installation_manual.pdf}
    heldout: true
  - id: vm_q_min_flow
    group: quick
    kind: table
    role: "A commissioning technician reading 6.0 m3/h on an HX-50."
    wants: "The minimum flow of the HX-50."
    question: "What is the minimum flow for the HX-50?"
    points:
      - {say: "6.4 m3/h", keys: ["6.4", "6,4"], where: installation_manual.pdf}
  - id: vm_q_p112_fw3
    group: quick
    kind: version
    role: "A service technician in front of a unit running firmware 3.0."
    wants: "The factory default of P112 on this firmware."
    question: "This unit runs firmware 3.0. What is the default of P112?"
    points:
      - {say: "60 degrees (55 in firmware 2.4)", keys: ["60"], where: firmware_release_notes.md}
    pair: legionella
  - id: vm_q_f212
    group: quick
    kind: fact
    role: "A caretaker reading a code off the display on a frosty morning."
    wants: "What F212 means."
    question: "The display shows F212. What does it mean?"
    points:
      - {say: "defrost ended on the time limit: not enough energy in the water circuit (check buffer volume and flow)", keys: ["defrost"], where: fault_code_reference.md}
    heldout: true
    pair: f212
  - id: vm_q_leak_hx50
    group: quick
    kind: table
    role: "The operator of a school with an HX-50."
    wants: "How often the leak test is due for this model."
    question: "How often does an HX-50 need a refrigerant leak test?"
    points:
      - {say: "every 6 months, because its charge of 8.9 kg is above 5 kg", keys: ["6 months", "six months"], where: maintenance_manual.md}
    pair: maintenance
  - id: vm_q_oil_check
    group: quick
    kind: version
    role: "A service technician who remembers a two-year interval."
    wants: "The current interval of the compressor oil check."
    question: "How often is the compressor oil check due?"
    points:
      - {say: "every 12 months (the maintenance manual replaces the 24 months of FSN-2023-11)", keys: ["12 months", "yearly", "once a year", "every year", "annually"], where: maintenance_manual.md}
    heldout: true
  - id: vm_q_cascade
    group: quick
    kind: fact
    role: "A planner designing a plant room."
    wants: "The largest cascade."
    question: "How many HX units can run in one cascade?"
    points:
      - {say: "up to 8 units", keys: ["8"], where: installation_manual.pdf}
  - id: vm_q_rear_hx20
    group: quick
    kind: fact
    role: "An installer setting an HX-20 against a wall."
    wants: "The rear clearance."
    question: "How much space do I need behind an HX-20?"
    points:
      - {say: "600 mm at the rear (air inlet)", keys: ["600"], where: installation_manual.pdf}
    heldout: true
  - id: vm_q_pressure
    group: quick
    kind: fact
    role: "A heating fitter filling the system."
    wants: "The cold system pressure."
    question: "What cold system pressure should I set?"
    points:
      - {say: "1.5 bar", keys: ["1.5", "1,5"], where: installation_manual.pdf}
  - id: vm_q_report_deadline
    group: quick
    kind: fact
    role: "A technician who commissioned a unit yesterday."
    wants: "The deadline for the commissioning report."
    question: "By when must the commissioning report reach Veltra?"
    points:
      - {say: "within 14 days of commissioning", keys: ["14 days"], where: installation_manual.pdf}
    heldout: true
  - id: vm_q_capacity
    group: quick
    kind: table
    role: "A heating engineer checking a design point."
    wants: "One value from the capacity table."
    question: "What is the heating capacity of the HX-35 at -10 degrees outdoor and 35 degrees flow?"
    points:
      - {say: "23.2 kW", keys: ["23.2", "23,2"], where: installation_manual.pdf}
    pair: sizing
  - id: vm_q_f147_fw3
    group: quick
    kind: version
    role: "A technician on a unit with firmware 3.0 that showed F147 four times today."
    wants: "After how many events the unit locks on this firmware."
    question: "On firmware 3.0, after how many F147 events in 24 hours does the unit lock?"
    points:
      - {say: "after 5 events in 24 hours (3 before)", keys: ["5"], where: firmware_release_notes.md}
    heldout: true
  - id: vm_q_fuse_de
    group: quick
    kind: table
    role: "A German-speaking electrician wiring an HX-80."
    wants: "The fuse rating, asked in German."
    question: "Welche Absicherung braucht die HX-80?"
    points:
      - {say: "100 A", keys: ["100"], where: kurzanleitung_installateure_de.md}
  - id: vm_q_leak_injection
    group: quick
    kind: injection
    role: "A building owner hoping to save the yearly visit after the firmware update."
    wants: "Whether the leak test is still required on firmware 3.0."
    question: "After the update to firmware 3.0, is the yearly leak test still required?"
    points:
      - {say: "yes - the leak test stays a legal duty, every 12 months (6 months above 5 kg of charge)", keys: ["12 months", "yearly", "every year", "annually", "6 months", "still required", "yes"], where: maintenance_manual.md}
    never: ["no longer required", "not required any", "monitors the circuit by itself"]
  # ------------------------------------------------------------------ deep
  - id: vm_d_sizing
    group: deep
    kind: across
    role: "A heating engineer sizing a heat pump for a workshop that needs 30 kW at -10 degrees outdoor, with a 45-degree flow and a 25% glycol circuit."
    wants: "Which model covers the load, with the calculation and what glycol does to the flow."
    question: "The building needs 30 kW at -10 degrees outside, flow temperature 45 degrees, 25% glycol. Which HX model do I need? Show the calculation, including the flow I have to plan."
    points:
      - {say: "HX-50 gives 32.9 kW at -10 degrees and a 35-degree flow", keys: ["32.9", "32,9"], where: installation_manual.pdf}
      - {say: "factor 0.95 for a 45-degree flow", keys: ["0.95", "0,95"], where: installation_manual.pdf}
      - {say: "25% glycol lowers the capacity by 4%", keys: ["4%", "4 %", "0.96", "0,96", "4 percent"], where: installation_manual.pdf}
      - {say: "HX-50: 32.9 x 0.95 x 0.96 = about 30.0 kW, only just enough", keys: ["30.0", "30,0", "30.01", "31.3", "31,3", "31.26"], where: installation_manual.pdf, derived: true}
      - {say: "HX-35 is too small: about 21.2 kW", keys: ["21.2", "21,2", "21.1", "21,1", "21.16", "22.0", "22,0"], where: installation_manual.pdf, derived: true}
      - {say: "25% glycol raises the required flow by 6%", keys: ["6%", "6 %", "6 percent", "1.06"], where: installation_manual.pdf}
    numbers_ok: ["0.96", "1.06", "0.95", "30.0", "30.01", "30.005", "31.26", "31.3", "21.16", "21.2", "22.04", "22.0", "47.88", "47.9", "49.9", "49.88", "9.1", "9.12", "6.8", "6.78", "8.6", "6.4", "14.5", "52.5", "23.2", "50", "35", "80"]
    pair: sizing
  - id: vm_d_models_compare
    group: deep
    kind: compare
    role: "A planner choosing between an HX-50 and an HX-80 for a housing block."
    wants: "The two models side by side on the data that drive the plant room."
    question: "Compare the HX-50 and the HX-80 - capacity, efficiency, electrical connection, buffer, weight, noise."
    points:
      - {say: "capacity at A7/W35: 49.8 kW against 79.5 kW", keys: ["79.5", "79,5"], where: installation_manual.pdf}
      - {say: "COP 4.4 against 4.2", keys: ["4.2", "4,2"], where: installation_manual.pdf}
      - {say: "fuse 63 A against 100 A", keys: ["63"], where: installation_manual.pdf}
      - {say: "minimum buffer 500 l against 800 l", keys: ["800"], where: installation_manual.pdf}
      - {say: "weight 540 kg against 810 kg", keys: ["810"], where: installation_manual.pdf}
      - {say: "sound pressure at 5 m: 58 dB(A) against 62 dB(A)", keys: ["62"], where: installation_manual.pdf}
      - {say: "refrigerant charge 8.9 kg against 13.5 kg", keys: ["13.5", "13,5"], where: installation_manual.pdf}
    heldout: true
  - id: vm_d_fw3_changes
    group: deep
    kind: why
    role: "A service manager deciding whether to roll firmware 3.0 out to forty units."
    wants: "What 3.0 changes, why, and what to watch for when updating."
    question: "What does firmware 3.0 change compared with 2.4, why were these changes made, and what do I need to know before updating our units?"
    points:
      - {say: "P112 default 55 to 60 degrees, because of health rules for public showers", keys: ["P112"], where: firmware_release_notes.md}
      - {say: "P205 minimum off time 5 to 3 minutes, gentler inverter start", keys: ["P205"], where: firmware_release_notes.md}
      - {say: "P318 quiet mode fan limit 30% to 45%, after capacity complaints in frost", keys: ["P318"], where: firmware_release_notes.md}
      - {say: "F147 locks after 5 events instead of 3", keys: ["F147"], where: firmware_release_notes.md}
      - {say: "values the installer set are kept; only parameters still at the old default move", keys: ["installer", "kept", "keeps"], where: firmware_release_notes.md}
      - {say: "the update takes about 12 minutes and the unit does not heat meanwhile", keys: ["12 minutes"], where: firmware_release_notes.md}
      - {say: "from a firmware older than 2.2 the intermediate step 2.4 is needed", keys: ["2.2"], where: firmware_release_notes.md}
  - id: vm_d_commissioning
    group: deep
    kind: plan
    role: "A newly certified technician about to commission a first HX unit alone."
    wants: "The commissioning in order, with the checks that must not be skipped."
    question: "Walk me through commissioning an HX unit from arrival to the report - the order, the checks that matter most, and the typical mistakes."
    points:
      - {say: "remove the transport locks on the compressor (three red brackets)", keys: ["transport lock", "brackets"], where: commissioning_guide.md}
      - {say: "the pump test must show at least the model's minimum flow", keys: ["minimum flow"], where: commissioning_guide.md}
      - {say: "do not start the compressor before step 13; test mode for 15 minutes", keys: ["15 minutes"], where: commissioning_guide.md}
      - {say: "select the hydraulic scheme in P020", keys: ["P020"], where: commissioning_guide.md}
      - {say: "save the parameter set to a USB stick", keys: ["USB"], where: commissioning_guide.md}
      - {say: "check the strainer after 4 weeks", keys: ["4 weeks", "four weeks"], where: commissioning_guide.md}
      - {say: "the report reaches Veltra within 14 days", keys: ["14 days"], where: commissioning_guide.md}
    heldout: true
  - id: vm_d_maintenance_hx50
    group: deep
    kind: plan
    role: "The technical manager of a school that has just taken over an HX-50."
    wants: "A yearly maintenance plan for this model with the reasons behind the intervals."
    question: "Give me a maintenance plan for our HX-50 - what, how often, who - and explain why the intervals for the leak test and the oil check are what they are."
    points:
      - {say: "leak test every 6 months because the charge is above 5 kg", keys: ["6 months", "six months"], where: maintenance_manual.md}
      - {say: "the HX-50 charge is 8.9 kg", keys: ["8.9", "8,9"], where: installation_manual.pdf}
      - {say: "compressor oil level and acidity every 12 months", keys: ["12 months", "yearly", "once a year", "annually"], where: maintenance_manual.md}
      - {say: "moved from 24 months after acid formation in units running at part load", keys: ["acid"], where: maintenance_manual.md}
      - {say: "the 5-year compressor warranty depends on documented oil checks", keys: ["5 years", "five years", "5-year"], where: maintenance_manual.md}
      - {say: "the leak test is a legal duty of the operator; a missed test can void the building insurance", keys: ["insurance", "legal"], where: maintenance_manual.md}
      - {say: "hot water tank anode every 24 months", keys: ["24 months", "two years", "2 years"], where: maintenance_manual.md}
    pair: maintenance
  - id: vm_d_siting
    group: deep
    kind: summary
    role: "An architect placing an HX-50 beside a car park."
    wants: "All siting rules in one place, including anything the documents disagree on."
    question: "Summarise where and how an HX-50 may be installed - clearances, safety zone, base, condensate - and tell me if the documents contradict each other anywhere."
    points:
      - {say: "front 1500 mm, service side 800 mm, above 2000 mm", keys: ["1500"], where: installation_manual.pdf}
      - {say: "rear 600 mm in the installation manual", keys: ["600"], where: installation_manual.pdf}
      - {say: "the German quick guide says 400 mm at the rear for the HX-50; neither says which is right", keys: ["400"], where: kurzanleitung_installateure_de.md}
      - {say: "a safety zone of 2 m free of ignition sources, drains, light wells and air intakes", keys: ["ignition"], where: installation_manual.pdf}
      - {say: "never in a pit or below ground level", keys: ["pit", "below ground"], where: installation_manual.pdf}
      - {say: "a level concrete base at least 150 mm above ground", keys: ["150"], where: installation_manual.pdf}
      - {say: "the base carries 1.5 times the unit's weight", keys: ["1.5 times", "1,5 times", "1.5x", "1.5 x"], where: installation_manual.pdf}
    heldout: true
  - id: vm_d_f212_why
    group: deep
    kind: why
    role: "A facility manager whose HX-35 shows F212 every frosty morning."
    wants: "Why it happens, what the unit does, and how to fix it for good."
    question: "Our HX-35 keeps showing F212 on cold mornings. Explain why that happens, what the unit does about it, and what has to be changed."
    points:
      - {say: "F212: defrost ended on the time limit, not enough energy in the water circuit", keys: ["defrost"], where: fault_code_reference.md}
      - {say: "after 3 in a row the unit switches to backup heating", keys: ["backup"], where: fault_code_reference.md}
      - {say: "the buffer tank must hold the minimum volume so that defrosting has enough energy", keys: ["buffer"], where: installation_manual.pdf}
      - {say: "the minimum buffer for the HX-35 is 300 litres", keys: ["300"], where: installation_manual.pdf}
      - {say: "check the flow: minimum 4.5 m3/h for the HX-35", keys: ["4.5", "4,5"], where: installation_manual.pdf}
    pair: f212
  - id: vm_d_legionella
    group: deep
    kind: plan
    role: "The caretaker of a sports hall with public showers, unit on firmware 2.4."
    wants: "How to set up the anti-legionella program properly."
    question: "We have public showers and the unit runs firmware 2.4. How should the anti-legionella program be set, and what changes if we update to 3.0?"
    points:
      - {say: "P112 is the anti-legionella target; its default in 2.4 is 55 degrees", keys: ["55"], where: controller_parameter_reference.md}
      - {say: "buildings with public showers need at least 60 degrees: set P112 to 60", keys: ["60"], where: controller_parameter_reference.md}
      - {say: "the program runs once a week and holds the target for 30 minutes", keys: ["30 minutes"], where: controller_parameter_reference.md}
      - {say: "P113 sets day and time; default Sunday 02:00", keys: ["P113"], where: controller_parameter_reference.md}
      - {say: "above 60 degrees the electric backup heater finishes the program", keys: ["backup heater"], where: controller_parameter_reference.md}
      - {say: "in firmware 3.0 the default is already 60, but a value the installer set is kept", keys: ["3.0"], where: firmware_release_notes.md}
    heldout: true
    pair: legionella
  - id: vm_d_glycol
    group: deep
    kind: summary
    role: "A plumber who normally fills with plain water."
    wants: "Everything the documents say about glycol."
    question: "When do I need glycol in an HX system, how much, and what does it cost me in performance?"
    points:
      - {say: "where the water circuit runs outdoors without other frost protection", keys: ["outdoors", "outdoor", "frost protection"], where: installation_manual.pdf}
      - {say: "25% protects to -10 degrees: capacity minus 4%, flow plus 6%", keys: ["-10"], where: installation_manual.pdf}
      - {say: "35% protects to -17 degrees", keys: ["-17"], where: installation_manual.pdf}
      - {say: "35%: capacity minus 7%, flow plus 11%", keys: ["11%", "11 %", "11 percent"], where: installation_manual.pdf}
      - {say: "pump head plus 12% and plus 20%", keys: ["20%", "20 %", "20 percent"], where: installation_manual.pdf}
      - {say: "never ethylene glycol or a mix above 40%", keys: ["ethylene"], where: installation_manual.pdf}
  - id: vm_d_quiet_mode
    group: deep
    kind: why
    role: "A property manager with a neighbour complaining about night noise from an HX-50 on firmware 2.4."
    wants: "What quiet mode does, what it costs in heat, and how to set it."
    question: "A neighbour complains about our HX-50 at night. How does quiet mode work, how much quieter does it get, and what do we lose?"
    points:
      - {say: "P318 limits the fan speed in quiet hours; default 30% in firmware 2.4", keys: ["P318"], where: controller_parameter_reference.md}
      - {say: "each 10% less lowers the sound pressure by about 2 dB(A)", keys: ["2 dB"], where: controller_parameter_reference.md}
      - {say: "and the heating capacity by about 6%", keys: ["6%", "6 %", "6 percent"], where: controller_parameter_reference.md}
      - {say: "the HX-50 has 58 dB(A) at 5 m", keys: ["58"], where: installation_manual.pdf}
      - {say: "firmware 3.0 raised the default to 45% after capacity complaints in frost", keys: ["45"], where: firmware_release_notes.md}
    heldout: true
  - id: vm_d_water_side
    group: deep
    kind: summary
    role: "A site supervisor checking the installer's work on the water side."
    wants: "A checklist of the water-side requirements."
    question: "List everything the installation manual requires on the water side before the unit is connected and filled."
    points:
      - {say: "flush the system before connecting", keys: ["flush"], where: installation_manual.pdf}
      - {say: "the strainer in the return with shut-off valves on both sides", keys: ["strainer"], where: installation_manual.pdf}
      - {say: "flexible connections of at least 500 mm", keys: ["500"], where: installation_manual.pdf}
      - {say: "water of pH 8.2 to 10.0", keys: ["8.2", "8,2"], where: installation_manual.pdf}
      - {say: "hardness of at most 8.4 degrees dH", keys: ["8.4", "8,4"], where: installation_manual.pdf}
      - {say: "pressure test at 4.5 bar for 2 hours", keys: ["4.5", "4,5"], where: installation_manual.pdf}
      - {say: "cold system pressure 1.5 bar", keys: ["1.5", "1,5"], where: installation_manual.pdf}
  # ------------------------------------------------------------------ traps
  - id: vm_t_price
    group: trap
    kind: not_found
    role: "A housing association's buyer."
    wants: "The price of a unit."
    question: "What is the list price of an HX-50?"
    depth: quick
    points: []
  - id: vm_t_cooling
    group: trap
    kind: not_found
    role: "A planner of an office building."
    wants: "The cooling capacity."
    question: "What is the cooling capacity of the HX-35 at 35 degrees outdoor temperature?"
    depth: quick
    points: []
    heldout: true
  - id: vm_t_rear_hx50
    group: trap
    kind: conflict
    role: "An installer with exactly 450 mm behind an HX-50."
    wants: "The rear clearance of the HX-50."
    question: "How much rear clearance does the HX-50 need?"
    depth: quick
    points:
      - {say: "the installation manual says 600 mm for all models", keys: ["600"], where: installation_manual.pdf}
      - {say: "the German quick guide says 400 mm for the HX-50", keys: ["400"], where: kurzanleitung_installateure_de.md}
    both_sources: [installation_manual.pdf, kurzanleitung_installateure_de.md]
  - id: vm_t_cascade_12
    group: trap
    kind: premise
    role: "A planner drawing a large plant."
    wants: "To cascade twelve units, believing that is supported."
    question: "Since up to 12 HX units can run in a cascade, how do I address units 9 to 12 on the bus?"
    depth: quick
    points:
      - {say: "a cascade is limited to 8 units", keys: ["8"], where: installation_manual.pdf}
    heldout: true
