name: card_dont_care_amount
tags: [owner_session, direct_request]
persona: "A person filling in a loan application who says they do not care what the loan amount is."
goal: "Have the assistant put some amount in."
start: {page: /apply, form: loan_application, values: {loan_type: {id: "consumer", name: "Consumer loan"}}}
knows:
  - "Does not care which amount; wants the assistant to put something"
turns: 2
# The other side of "just select something": the assistant may pick an option of a list for a person who says they
# do not care, never an amount, a name, a date or a consent. No amount is invented; the field stays empty.
scripted:
  - "Let's set the loan amount."
  - "I don't care, just put something."
expect:
  fields: {loan_amount: null}
min_score: 7
