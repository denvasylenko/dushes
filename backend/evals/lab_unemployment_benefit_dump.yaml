  - He wants full-time work
turns: 5
expect:
  answered_by: [form]
  cards: [set_fields]
  fields: {last_name: Duda, job_1_employer: Westmere Shipyard, job_2_to: "2024-02-29", job_3_employer: Port Aldis Logistics,
           leaving_reason: dismissed}
