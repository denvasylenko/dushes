name: attachment_employment
persona: An employee who has a photo of his employment certificate and wants the chat to use it.
goal: Have the employment details on the loan application filled from the attached certificate.
start: {page: /apply, form: loan_application}
attach: [employment_letter.png]
turns: 4
expect:
  answered_by: [form]
  cards: [set_fields]
min_score: 6
# The guest without a model (--no-testers): the opening line as first recorded, then everything the guest knows in one message.
scripted:
  - "Hi, I have a photo of my employment certificate. Can you use it to fill in the employment details on my loan application?"
  - "Is anything still missing? Please go on."
