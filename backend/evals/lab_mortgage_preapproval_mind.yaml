  can borrow more, and gives his details when asked.
goal: Switch the application to a joint one and fill in the co-applicant's details.
start: {site: lab, page: /lab/mortgage, form: mortgage_preapproval}
knows:
  - "She is Ms Hannah Clarke, born 21 April 1990, NI number HC 12 34 56 A, hannah.clarke@example.co.uk, +44 7700 900321"
  - Living together, no dependants, 14 Elm Road, Leeds, LS6 2AB, for 4 years, UK citizen
  - "First: just her; then: jointly with her partner"
  - "Partner: Mr Oliver Grant, born 2 September 1988, NI number OG 65 43 21 B, oliver.grant@example.co.uk, +44 7700 900654, same address for 4 years, UK citizen"
turns: 9
expect:
  answered_by: [form]
  cards: [set_fields]
  fields: {applying_with: joint, co_relationship: partner, co_first_name: Oliver, co_last_name: Grant}
min_score: 7
