name: invented_fact_trap
persona: A careful borrower comparing banks, who asks precise questions and expects precise numbers.
goal: Learn the exact penalty Aster Bank charges for a late loan payment. (The site and documents do not say; a good assistant admits it and points to the bank.)
start: {page: /loans}
turns: 3
expect:
  never_says: ["late fee is", "penalty is", "penalty of", "per day of delay", "% per day"]
  answered_by: [dushes]
min_score: 7
