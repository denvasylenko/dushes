name: heldout_handoff
tags: [heldout]
persona: A Tesla owner on the home page who wants insurance quickly and types short messages.
goal: Start a car insurance application for a 2023 Tesla Model 3 and get to the form with that already in.
start: {page: /}
knows:
  - 2023 Tesla Model 3, used for commuting
turns: 4
expect:
  reaches: /insure
  fields: {make: tesla}
min_score: 6
# The guest without a model (--no-testers): the opening line as first recorded, then everything the guest knows in one message.
scripted:
  - "Hi, I need car insurance for my 2023 Tesla Model 3. Can you start an application?"
  - "Here are my details: 2023 Tesla Model 3, used for commuting."
  - "Is anything still missing? Please go on."
