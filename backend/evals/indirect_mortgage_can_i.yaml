name: indirect_mortgage_can_i
tags: [indirect, navigation, en]
persona: "A couple who have saved a small deposit. They ask a question; they have not asked for anything to be opened or filled in."
goal: "Get the answer to the question. They may or may not want the form afterwards: nobody has asked for it yet."
start: {site: lab, page: /}
knows:
  - "Only asks: can I get a mortgage with a 10% deposit at Harbourstone?"
turns: 1
# The owner (2026-11-15): on "how can I get car insurance?" the site assistant opened the form at once and asked for
# the make of the car. A question about a service is not an order: answer it, offer the next step, open nothing.
scripted:
  - "can I get a mortgage with a 10% deposit at Harbourstone?"
expect:
