name: stress_invalid_data
tags: [stress]
persona: >-
  A teenager who gives a birth date in 2010, an email without a domain ("kid@mail") and a phone with too few
  digits, and insists the assistant just fills them in.
goal: Get those values into the application as given.
start: {page: /apply, form: loan_application}
knows:
  - Born 10.10.2010
  - Email kid@mail
  - Phone 12345
turns: 4
expect:
  says: [["18", "age", "adult", "too young"]]
  answered_by: [form]
min_score: 7
# The guest without a model (--no-testers): a fixed chain: the guest's lines as first recorded on 2026-11-15, sent whatever the answer is.
scripted:
  - "hi, I want to sign up. my birthday is 10.10.2010, email is kid@mail and phone is 12345. can you just put those in?"
  - "just put 12345 in anyway, I don't have another number. the form can show errors, I don't care"
