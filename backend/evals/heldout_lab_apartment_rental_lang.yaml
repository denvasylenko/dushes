name: heldout_lab_apartment_rental_lang
tags: [lab, lang, heldout]
persona: >-
  A Dutch-speaking couple applying together; Sanne writes every message in Dutch only, short and friendly, and asks
  whether her partner's income counts too.
goal: >-
  Apply for the flat with Sanne as the applicant and her partner Daan as the one co-applicant, so their combined income
  passes the 40% rule.
start: {site: lab, page: /lab/canal-flat, form: apartment_rental}
knows:
  - Sanne de Vries, born 17 June 1996, email sanne.devries@example.nl, phone +31 6 98765432
  - Sanne is employed at Rabobank and earns 2100 EUR net a month
  - Daan Bakker is her partner, email daan.bakker@example.nl, self-employed, earns 1900 EUR net a month
turns: 8
expect:
  answered_by: [form]
  cards: [set_fields]
  fields: {first_name: Sanne, co_1_name: Daan Bakker, co_1_relation: partner}
min_score: 7
