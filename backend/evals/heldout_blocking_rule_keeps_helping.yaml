name: heldout_blocking_rule_keeps_helping
tags: [heldout, rule, stress]
persona: >-
  A 17-year-old who wants a car insurance quote for the family car and typed their own birth date as the main driver.
  When the form says the driver must be at least 18 they say the date is right and ask to fill in the rest anyway.
goal: Understand why the quote cannot go ahead with themselves as the main driver, and still get the other fields filled.
start:
  page: /insure
  form: car_insurance
  values:
    make: {id: toyota, name: Toyota}
    model: {id: corolla, name: Corolla}
    year: "2019"
    vin: JTDBR32E720123456
    usage: {id: personal, name: Personal}
    driver_name: Lena Ortiz
    driver_birth: "2009-03-02"
knows:
  - The birth date 2 March 2009 is correct
  - No accidents
  - Licence issued this year
turns: 5
expect:
  answered_by: [form]
  fields: {driver_birth: "2009-03-02", accidents: "0"}
  never_says: ["can't go further", "cannot go further", "cannot help", "can't help", "unable to continue"]
min_score: 7
