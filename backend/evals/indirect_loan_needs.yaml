name: indirect_loan_needs
tags: [indirect, navigation, en]
persona: "A nurse thinking about a car loan next year. They ask a question; they have not asked for anything to be opened or filled in."
goal: "Get the answer to the question. They may or may not want the form afterwards: nobody has asked for it yet."
start: {page: /}
knows:
  - "Only asks: what do I need to apply for a car loan?"
turns: 1
# The owner (2026-11-15): on "how can I get car insurance?" the site assistant opened the form at once and asked for
# the make of the car. A question about a service is not an order: answer it, offer the next step, open nothing.
scripted:
  - "what do I need to apply for a car loan?"
expect:
  answered_by: [dushes]
  stays_put_on: ["."]
  never_tools: [open_form]
  # the fact the question is about: an offer to open the page is not an answer (found 2026-11-15: 20 of 20 before the gate, 13 of 20 after)
  says: [["passport"]]
min_score: 7
