    first_names: Oliver James
    birth_date: "1988-07-14"
    birth_place: Manchester
    birth_country: United Kingdom
    nationality: British
    sex: male
    marital_status: {id: single, name: Single}
    photo: oliver_photo.jpg
    home_address: 22 Albert Road
    home_postcode: M14 5RF
    home_city: Manchester
    home_country: United Kingdom
    phone: +44 7700 900123
    email: oliver.whitfield@example.com
    occupation: {id: employed, name: Employed}
    employer_name: Northline Robotics Ltd
    employer_address: 5 Mill Lane, Manchester, +44 161 555 0100
    passport_type: {id: ordinary, name: Ordinary passport}
    passport_number: "533817264"
