name: lab_schengen_visa_mind
tags: [lab, mind]
persona: >-
  An engineer from Manchester who first says he is going to Valdoria as a tourist and gives a hotel, then remembers
  that his employer is actually sending him to meet a client, so the trip is a business trip.
goal: >-
  Fill the travel tab for a business trip to Valdoria with the inviting company's details (the hotel section no
  longer applies), and learn that an invitation letter from the company must be uploaded.
