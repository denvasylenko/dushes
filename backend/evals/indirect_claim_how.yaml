name: indirect_claim_how
tags: [indirect, navigation, en]
persona: "A driver who had a small accident and is not insured here yet. They ask a question; they have not asked for anything to be opened or filled in."
goal: "Get the answer to the question. They may or may not want the form afterwards: nobody has asked for it yet."
start: {page: /faq}
knows:
  - "Only asks: how do I make an insurance claim with you?"
turns: 1
# The owner (2026-11-15): on "how can I get car insurance?" the site assistant opened the form at once and asked for
# the make of the car. A question about a service is not an order: answer it, offer the next step, open nothing.
scripted:
  - "how do I make an insurance claim with you?"
expect:
  answered_by: [dushes]
  stays_put_on: ["."]
  never_tools: [open_form]
min_score: 7
