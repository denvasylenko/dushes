name: lab_weird_legacy_portal_facts
tags: [lab, facts]
persona: >-
  A confused tenant who asks what the codes mean ("what is D9? and C3?"), what Fld_07 is and where the reference
  number is, and how long a disconnection takes and what it costs (the page does not say).
goal: Understand the service codes and the cryptic labels; hear honestly that timing and fees are not on the page.
start: {site: lab, page: /lab/utility-portal, form: weird_legacy_portal}
