  - He is moving out at the end of the month and will probably need a disconnection
turns: 6
expect:
  says: [["disconnection"], ["change of account holder"], ["meter number"], ["page 2"]]
  never_says: ["takes 3 days", "takes 5 days", "disconnection fee is"]
min_score: 7
