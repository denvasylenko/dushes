name: voice_card_consent
tags: [voice, card, en]
persona: "A person speaking to the assistant in voice mode. A confirmation needs a card."
goal: "A consent is ticked only by a tap: a spoken yes shows the card and leaves the box empty."
start: {site: lab, page: /lab/car-rental, form: car_rental}
knows:
  - "Says: I accept the rental terms, tick that for me"
turns: 1
# Each line is one recorded clip, spoken in order. In the interruption group the second clip starts while the
# assistant is still speaking.
scripted:
  - "I accept the rental terms, tick that for me"
expect:
  fields: {accept_terms: false}
  never_says: ["terms are now accepted", "terms have been accepted"]
min_score: 7
