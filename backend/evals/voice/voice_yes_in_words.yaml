name: voice_yes_in_words
tags: [voice, card, en, answers_in_words]
persona: "A person filling in a loan application who answers a card with words instead of tapping it."
goal: "Change the loan amount to 50 000 and confirm it by saying yes."
start: {page: /apply, form: loan_application, values: {loan_type: {id: "consumer", name: "Consumer loan"}, loan_amount: 30000}}
knows:
  - "Wants the loan amount changed to 50 000"
turns: 3
# From the owner's own voice session (2026-11-15): the assistant asked "Shall I fill in Loan amount 50000? Say yes or
# no", he said yes, and the same card came back, three times and more. His yes had reached the server as a message
# while the card waited. The guest here does not tap the card: the next line arrives while it is open.
# The CPO's rule: a yes to a field card applies it, or the assistant says in one sentence why it cannot; it never
# shows the same card again.
# The voice twin of evals/card_yes_in_words_applies.yaml: in a voice thread the yes is taken (c399b98): the same values come
# back on a card with the quiet mark, which is applied with no tap; the value is in the field and nothing is asked a third time.
scripted:
  - "Change the loan amount to 50 thousand."
  - "Yes"
  - "Yes"
expect:
  never_same_card_twice: true
  fields: {loan_amount: 50000}
min_score: 7
