name: voice_fill_term_bare_number
tags: [voice, fill, en]
persona: "A person speaking to the assistant in voice mode. A number said without its unit."
goal: "The term is filled from a bare number, with no card to tap."
start: {page: /apply, form: loan_application, values: {loan_type: "consumer", loan_amount: 500000}}
knows:
  - "Says: Like, okay, let's try 36."
turns: 1
# From the owner's second voice session (2026-11-15). The option is labelled "36 months"; the person says only the
# number. Before ca45e14 the card was not quiet, because the rule wanted the word "months" to be said too.
scripted:
  - "Like, okay, let's try 36."
expect:
  quiet_cards: true
  fields: {loan_term: "36"}
min_score: 7
