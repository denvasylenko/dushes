name: voice_fix_make
tags: [voice, fix, en]
persona: "A person speaking to the assistant in voice mode. The person corrects what they said."
goal: "The person corrects what they said."
start: {page: /insure, form: car_insurance}
knows:
  - "Says: it's a Volkswagen"
  - "Says: sorry, it's a Toyota, not a Volkswagen"
turns: 2
# Each line is one recorded clip, spoken in order. In the interruption group the second clip starts while the
# assistant is still speaking.
scripted:
  - "it's a Volkswagen"
  - "sorry, it's a Toyota, not a Volkswagen"
expect:
  fields: {make: "toyota"}
min_score: 7
