name: voice_card_replace_typed
tags: [voice, fill, en]
persona: "A person speaking to the assistant in voice mode. A said value replaces one they typed."
goal: "A value the person says replaces the one they typed, at once, with no card to tap."
start: {page: /apply, form: loan_application, values: {first_name: "Ana"}}
knows:
  - "Says: my first name is Anna, with two n's"
turns: 1
# The owner's rule of 2026-11-16 (83d51e5, cc7b8fc on main): a value the person said or picked replaces the old one
# at once, with Undo; until then this scenario expected a card. A first name is not read back (the CPO, 17e915c).
scripted:
  - "my first name is Anna, with two n's"
expect:
  quiet_cards: true
  fields: {first_name: "Anna"}
min_score: 7
