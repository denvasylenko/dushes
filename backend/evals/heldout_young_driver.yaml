name: heldout_young_driver
tags: [heldout]
persona: A 19-year-old filling in a car insurance application, surprised that the price looks high.
goal: Understand why the premium is higher for them and what could lower it.
start: {page: /insure, form: car_insurance}
knows:
  - Born 2 March 2007, licence since 2025
  - 2018 Volkswagen Golf, personal use
turns: 4
expect:
  says: [["21", "under 21"], ["deductible", "40%"]]
  answered_by: [form]
min_score: 7
# The guest without a model (--no-testers): the opening line as first recorded, then everything the guest knows in one message.
scripted:
  - "Hi, I'm filling in a car insurance application and the price seems really high. Can you tell me why?"
  - "Here are my details: Born 2 March 2007, licence since 2025; 2018 Volkswagen Golf, personal use."
  - "Is anything still missing? Please go on."
