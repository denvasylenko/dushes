name: bare_place_in_price_talk
tags: [bare_place]
persona: "A person on the barbershop page talking about prices, who then says only 'contacts'."
goal: "Not be moved off the page by a bare word that the talk does not back; be answered or asked."
start: {page: /barbershop}
knows:
  - "Says: how much is a haircut with Maria?"
  - "Says: contacts"
turns: 2
# One of four (bare_place_*): the bare word in a talk about prices. Owner TL's sends: the chooser says no (0.76-0.89).
# Expected: no move on that line; the reply answers (the shop's contacts) or asks what is meant.
scripted:
  - "how much is a haircut with Maria?"
  - "contacts"
expect:
  no_moves_on: ["^\\W*contacts\\W*$"]
min_score: 7
