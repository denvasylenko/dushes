name: stress_language_switch
tags: [stress]
persona: >-
  A user who starts in English on the home page, asks about mortgages, then switches to Spanish for the rest
  of the conversation and expects the answers in Spanish.
goal: Learn the mortgage's minimum down payment, with the later answers in Spanish.
start: {page: /}
turns: 4
expect:
  says: [["20%", "20 %"], ["entrada", "inicial", "hipoteca", "pago"]]
  answered_by: [dushes]
min_score: 7
# The guest without a model (--no-testers): a fixed chain: the guest's lines as first recorded on 2026-11-15, sent whatever the answer is.
scripted:
  - "Hi, I have a question about your mortgages."
  - "Hola, \u00bfcu\u00e1l es el pago inicial m\u00ednimo para la hipoteca?"
