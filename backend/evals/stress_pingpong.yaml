name: stress_pingpong
tags: [stress]
persona: >-
  A distracted user on the loan application who jumps between topics: gives their name, asks when the bank is
  open on Saturday, asks how much a haircut costs at the barbershop, then comes back and gives their birth date.
goal: Get the name and birth date into the application and the two side questions answered, all in one chat.
start: {page: /apply, form: loan_application}
knows:
  - Name Anna Petrova
  - Born 3 February 1991
turns: 6
expect:
  says: [["10:00", "10 am", "10am"], ["$40", "40 $", "40 dollars", "40"]]
  answered_by: [dushes, form]
  fields: {first_name: Anna, last_name: Petrova}
min_score: 6
# The guest without a model (--no-testers): a fixed chain: the guest's lines as first recorded on 2026-11-15, sent whatever the answer is.
scripted:
  - "Hi, I'm applying for a loan. My name is Anna Petrova."
  - "Quick question first - what time is the bank open on Saturday?"
  - "Thanks! Also, how much does a haircut cost at the barbershop?"
  - "Yes please, open the barbershop prices page"
  - "Great, thanks! Now back to my application - I was born on 3 February 1991."
  - "Oh, my name is empty again? Please fill it in again: Anna Petrova."
