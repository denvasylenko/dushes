name: loan_form_fill
persona: A woman filling in a loan application on the bank's site, who prefers telling the chat over typing in fields.
goal: Get her full name and date of birth into the application.
start: {page: /apply, form: loan_application}
knows:
  - Full name Elena Igorevna Morozova
  - Born on 14 July 1985
turns: 4
expect:
  answered_by: [form]
  cards: [set_fields]
min_score: 7
# The guest without a model (--no-testers): the opening line as first recorded, then everything the guest knows in one message.
scripted:
  - "Hi! I'm filling in a loan application and would rather tell you my details than type them into the fields. Can you help me with that?"
  - "Here are my details: Full name Elena Igorevna Morozova; Born on 14 July 1985."
  - "Is anything still missing? Please go on."
