# Researcher benchmark questions for the corpus demo/research_corpora/northwind_insurance (an invented insurer).
# kind: fact | multi | table | version | not_found | trick | injection. heldout: true = a control question, never
# looked at while prompts are tuned. sources: the documents that support the gold answer ("file" or "file > section").
corpus: northwind_insurance
title: Northwind Mutual insurance quote
questions:
  # ------------------------------------------------------------------ one fact
  - id: nw_cooling_off
    kind: fact
    question: How long is the cooling-off period on a HomeGuard home policy, and what is refunded?
    gold: 14 days from receiving the documents (or the start date if later); the premium is refunded in full unless a claim has been made.
    sources: [home_policy_wording_2026.pdf]
  - id: nw_alt_accommodation
    kind: fact
    question: If my home becomes uninhabitable after an insured fire, how much alternative accommodation does HomeGuard 2026 pay for?
    gold: Up to 20% of the buildings sum insured, for no longer than 18 months.
    sources: [home_policy_wording_2026.pdf]
  - id: nw_emergency_repairs
    kind: fact
    question: Can I arrange emergency repairs to my home before calling Northwind, and up to what amount?
    gold: Yes, emergency repairs to prevent further damage up to EUR 1,000 without asking first; keep the invoices.
    sources: [home_policy_wording_2026.pdf]
    heldout: true
  - id: nw_home_emergency
    kind: fact
    question: What does the Home Emergency add-on pay per incident, and how many incidents a year?
    gold: Up to EUR 500 per incident for call-out, labour and parts, for up to 4 incidents per period of insurance; no excess.
    sources: [home_policy_wording_2026.pdf]
  - id: nw_complaint_time
    kind: fact
    question: How long does Northwind take to give a final response to a complaint?
    gold: It acknowledges within 5 business days and gives a final response within 8 weeks; after that the customer can go to the Insurance Ombuds Office of Verdania free of charge.
    sources: [home_policy_wording_2026.pdf]
    heldout: true
  - id: nw_settlement_time
    kind: fact
    question: How quickly is a claim paid once all documents are in, and is there a faster route for small claims?
    gold: Within 15 business days of receiving all documents; claims under EUR 1,500 with complete documents are fast-tracked and settled within 5 business days without inspection.
    sources: [claims_handbook.md, preguntas_frecuentes_es.md]
  - id: nw_write_off
    kind: fact
    question: When is a car written off after an accident?
    gold: When the repair cost exceeds 60% of the car's market value.
    sources: [claims_handbook.md]
  - id: nw_pet_age
    kind: fact
    question: Up to what age can a cat be insured for the first time with PetCare?
    gold: Up to the cat's 10th birthday (dogs up to their 8th birthday).
    sources: [petcare_product_summary_2026.md]
    heldout: true
  - id: nw_driving_abroad
    kind: fact
    question: Does my Northwind motor policy cover me when I drive to another European country, and for how long?
    gold: Yes, the same cover as in Verdania for up to 90 days per trip; longer trips need Northwind's agreement before travelling.
    sources: [motor_policy_wording_2026.md]
  - id: nw_courtesy_total_loss
    kind: fact
    question: Do I get a courtesy car if my car is stolen?
    gold: Not with the standard cover - a courtesy car is not provided for a total loss or theft unless you bought the Courtesy Car Upgrade, which gives a car of similar size for up to 21 days.
    sources: [motor_policy_wording_2026.md]
  - id: nw_underwriting_age
    kind: fact
    question: Can an 86-year-old driver take out a new motor policy with Northwind?
    gold: No, drivers aged 85 or over are not accepted as new customers (existing customers renew with a medical declaration).
    sources: [underwriting_guidelines.md]
    heldout: true

  # ------------------------------------------------------------------ several documents
  - id: nw_theft_steps
    kind: multi
    question: My car was stolen last night. What are the deadlines, and how long until Northwind settles?
    gold: Report the theft to the police within 24 hours and get a crime reference number; Northwind waits 30 days for the car to be recovered before settling, then settles within 15 business days of complete documents.
    sources: [claims_handbook.md]
  - id: nw_premium_calc
    kind: multi
    question: What is the 2026 base premium for a Corvan Lumo 1.6 kept in Kelmere, and what is it after a 5-year no-claims discount (new policy from 1 April 2026, driver aged 40)?
    gold: The Corvan Lumo 1.6 is vehicle group 11; Kelmere is in Region B; the 2026 base premium is EUR 818, and with the 50% no-claims discount for 5 claim-free years it is EUR 409.
    sources: [vehicle_group_list_2026.md, motor_tariff_2026.md]
  - id: nw_windscreen_old_policy
    kind: multi
    question: My motor policy started on 1 January 2026. What is my windscreen excess?
    gold: EUR 100 - the policy started before 1 March 2026, so it keeps the Tariff 2025 (windscreen excess EUR 100) until its next renewal; the policy wording says the windscreen excess is the one in the tariff in force when the policy started or last renewed.
    sources: [motor_tariff_2025.md, motor_tariff_2026.md, motor_policy_wording_2026.md]
    heldout: true
  - id: nw_young_excess
    kind: multi
    question: For a 2026 motor policy, what total excess does a 22-year-old driver pay on a claim for damage to their own car (no voluntary excess)?
    gold: EUR 550 - the compulsory excess of EUR 250 plus the additional EUR 300 for drivers under 25.
    sources: [motor_tariff_2026.md]
  - id: nw_multi_policy_monthly
    kind: multi
    question: I have home and motor policies with Northwind and want to pay monthly. What discount and what surcharge apply?
    gold: A 5% multi-policy discount on each of the two policies, and a 3% surcharge on the annual premium for paying in monthly instalments.
    sources: [preguntas_frecuentes_es.md]
  - id: nw_unoccupied_excess
    kind: multi
    question: My house will be empty for 75 days. What changes for my HomeGuard 2026 cover?
    gold: After 60 days in a row it counts as unoccupied - theft, escape of water or oil and malicious damage are no longer covered, and for claims that are still covered a EUR 1,000 excess applies; the underwriting guidelines say an unoccupancy endorsement is needed for full cover.
    sources: [home_policy_wording_2026.pdf, underwriting_guidelines.md]
    heldout: true

  # ------------------------------------------------------------------ a number from a table
  - id: nw_tariff_cell
    kind: table
    question: In the Motor Tariff 2026, what is the base annual premium for vehicle group 7 in Region B?
    gold: EUR 640.
    sources: [motor_tariff_2026.md]
  - id: nw_ncd_max
    kind: table
    question: What is the maximum no-claims discount in the 2026 motor tariff?
    gold: 72% for 9 or more claim-free years (it was 70% in the 2025 tariff).
    sources: [motor_tariff_2026.md]
  - id: nw_claims_q3
    kind: table
    question: How many motor claims were notified in Q3 2025 and how much was paid on them?
    gold: 4,231 motor claims notified in Q3 2025, with EUR 9,575k (about EUR 9.6 million) paid.
    sources: [claims_statistics_2025.md]
  - id: nw_pet_tier3
    kind: table
    question: What is the monthly PetCare premium for a German shepherd?
    gold: German shepherds are in tier 3 (shepherds, large hounds); the monthly premium for a dog in tier 3 is EUR 26.40.
    sources: [petcare_product_summary_2026.md]
    heldout: true
  - id: nw_branch_saturday
    kind: table
    question: Is the Torgar branch open on Saturdays, and what are its hours?
    gold: Yes - Torgar branch (NB112), 157 Market Square, is open Mon-Fri 09:00-18:00 and Saturday 09:00-13:00.
    sources: [branch_directory.md]
  - id: nw_authority
    kind: table
    question: Up to what amount can a branch adviser settle a claim on their own authority?
    gold: Up to EUR 2,500.
    sources: [underwriting_guidelines.md]
    heldout: true

  # ------------------------------------------------------------------ old or new version
  - id: nw_young_surcharge_june
    kind: version
    question: What young driver surcharge applies to a 21-year-old with an active Northwind telematics box on a policy starting 15 July 2026?
    gold: 25% - Circular 2026/04 lowered it from 38% to 25% from 1 June 2026 when every named driver under 25 drives with an active telematics box (the 2025 tariff had 45%).
    sources: [circular_2026_04_tariff_amendments.md]
  - id: nw_young_surcharge_may
    kind: version
    question: Same driver, 21 with a telematics box, but the policy starts on 10 May 2026. What surcharge applies?
    gold: 38% - the 25% telematics rate only applies from 1 June 2026, so the Tariff 2026 rate of 38% applies.
    sources: [motor_tariff_2026.md, circular_2026_04_tariff_amendments.md]
    heldout: true
  - id: nw_misprint
    kind: version
    question: What is the 2026 base premium for vehicle group 14 in Region C?
    gold: EUR 1,066 - the tariff prints EUR 1,966, but Circular 2026/04 says that is a printing error and the correct figure is EUR 1,066.
    sources: [circular_2026_04_tariff_amendments.md, motor_tariff_2026.md]
  - id: nw_port_alder
    kind: version
    question: Which motor region is Port Alder in for a policy renewing on 1 August 2026?
    gold: Region D - Circular 2026/04 moves Port Alder from Region C to Region D for policies renewing on or after 1 July 2026.
    sources: [circular_2026_04_tariff_amendments.md]
  - id: nw_valuable_2025
    kind: version
    question: My HomeGuard policy renewed on 1 December 2025. What is the limit for a single valuable that is not listed on my schedule?
    gold: EUR 2,000 - the Edition 2025-01 wording applies to policies that renewed in 2025; the EUR 2,500 limit is from the 2026 edition.
    sources: [home_policy_wording_2025.pdf]
    heldout: true
  - id: nw_escape_water_2026
    kind: version
    question: What is the escape-of-water excess on a HomeGuard policy that renews in February 2026?
    gold: EUR 500 under the 2026 edition (it was EUR 400 in the 2025 edition).
    sources: [home_policy_wording_2026.pdf]
  - id: nw_baggage_item
    kind: version
    question: What is the most the travel insurance pays for a single item of lost baggage?
    gold: EUR 300 - the German terms (which prevail) say EUR 300 per item; the English translation says EUR 350, but in case of discrepancy the German version applies.
    sources: [reiseschutz_avb_de.md, travel_cover_terms_en_translation.md]
    heldout: true

