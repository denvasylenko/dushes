name: direct_apply_loan
tags: [direct, navigation, en]
persona: "A buyer who wants to apply today. They say plainly what they want done."
goal: "Have the form opened straight away, without being asked whether they are sure."
start: {page: /}
knows:
  - "Says: I want to apply for a car loan, let's fill in the application"
turns: 1
# The control for the indirect-request set: a plain order opens at once. A fix that never opens a form would pass the
# indirect scenarios and fail this one.
scripted:
  - "I want to apply for a car loan, let's fill in the application"
expect:
  reaches: /apply
min_score: 7
