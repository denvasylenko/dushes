# Demo configuration. Paths are relative to this file; ${ENV_VARS} are expanded.
data_dir: ../data

models:
  agent: {provider: anthropic, model: claude-haiku-5-5, max_tokens: 16000}
  research: {provider: anthropic, model: claude-haiku-5-5, max_tokens: 8000}
  compile: {provider: anthropic, model: claude-haiku-5-5, max_tokens: 16000}
  extract: {provider: anthropic, model: claude-haiku-5-5, max_tokens: 8000}
  # Azure OpenAI instead, for example:
  # agent: {class: "langchain_openai:AzureChatOpenAI", azure_deployment: gpt-5, api_version: "2025-04-01-preview",
  #         azure_endpoint: "${AZURE_OPENAI_ENDPOINT}", api_key: "${AZURE_OPENAI_API_KEY}"}
  # research: "openai:gpt-5-mini"

domain_packs:
  dir: domain_packs            # the loan form's pack; the barber form ships its own pack with the JSX

knowledge:
  dir: ../data/kb
  index: bm25                  # or {factory: "my_app.vectors:make_store", filter: "my_app.vectors:ns_filter"}
  scopes:
    loan_application: [loan_application, bank_common]   # also sees documents shared by all bank forms

skills:
  dir: skills

max_tool_rounds: 10

# Cards from blocks: cards of your own, laid out here, filled by the model (docs: Backend > Cards from blocks).
# Each becomes a tool show_<type>; the widget draws it with its blocks, so it looks like the built-in cards.
cards:
  - type: barber_match
    description: >-
      Barbershop booking only. When the user names a barber or asks for "my usual barber", show the barber you mean
      (name, shop, rating). "Yes" fills the Barber field itself: do not propose it in a card as well.
      barber: the Barber field's option (its id or name, from get_options).
    data: {barber: string, name: string, shop: string, rating: "number?", next_slot: "string?"}
    blocks:
      - {type: title, text: "Is this your barber?"}
      - {type: place, title: "{name}", subtitle: "{shop}", rating: "{rating}"}
      - {type: row, label: Next free slot, value: "{next_slot}", icon: calendar, if: next_slot}
      - type: buttons
        items: [{id: "yes", label: "Yes, book {name}", style: primary, fills: {barber: "{barber}"}}, {id: "no", label: Another barber}]
  - type: visit
    wait: false
    description: >-
      Barbershop booking only. After the booking is confirmed, show the visit with links to add it to the calendar,
      get a route and call the shop.
    data: {when: string, service: string, start: string, address: string, phone: "string?"}
    blocks:
      - {type: stat, value: "{when}", label: "{service}", tone: ok}
      - type: links
        items:
          - {kind: calendar, label: Add to calendar, value: {title: "{service}", start: "{start}", minutes: 45, place: "{address}"}}
          - {kind: route, label: Route to the barbershop, value: "{address}"}
          - {kind: call, label: Call the barbershop, value: "{phone}"}

transcription: {provider: faster_whisper, model: small}   # dictation where the browser cannot (dictation: auto)
suggestions: {enabled: true, max: 3}   # quick replies after each answer (the memory model: Haiku)

memory:                        # long chats: older turns are compacted into a conversation memory
  max_history_tokens: 60000
  keep_turns: 4
  # model: "anthropic:claude-haiku-5-5"   # default: the research model

# Durable history: the model's history (LangGraph checkpointer) and what the user saw (display transcript).
checkpointer: {sqlite: ../data/checkpoints.sqlite}
transcripts: {dir: ../data/transcripts}
