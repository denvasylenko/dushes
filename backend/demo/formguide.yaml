# Demo configuration. Paths are relative to this file; ${ENV_VARS} are expanded.
data_dir: ../data

models:
  agent: {provider: anthropic, model: claude-opus-5-5, max_tokens: 16000, output_config: {effort: low}}
  research: {provider: anthropic, model: claude-sonnet-5-5, max_tokens: 8000}
  compile: {provider: anthropic, model: claude-opus-5-5, max_tokens: 16000, output_config: {effort: medium}}
  extract: {provider: anthropic, model: claude-opus-5-5, max_tokens: 8000, output_config: {effort: low}}
  # Azure OpenAI instead, for example:
  # agent: {class: "langchain_openai:AzureChatOpenAI", azure_deployment: gpt-5, api_version: "2025-04-01-preview",
  #         azure_endpoint: "${AZURE_OPENAI_ENDPOINT}", api_key: "${AZURE_OPENAI_API_KEY}"}
  # research: "openai:gpt-5-mini"

domain_packs:
  dir: domain_packs            # the loan form's pack; the barber form ships its own pack with the JSX

knowledge:
  dir: ../data/kb
  index: bm25                  # or {factory: "my_app.vectors:make_store", filter: "my_app.vectors:ns_filter"}
  scopes:
    loan_application: [loan_application, bank_common]   # also sees documents shared by all bank forms

skills:
  dir: skills

max_tool_rounds: 10

memory:                        # long chats: older turns are compacted into a conversation memory
  max_history_tokens: 60000
  keep_turns: 4
  # model: "anthropic:claude-haiku-5-5"   # default: the research model
