# The demo site's map: a portal of three local businesses, a bank, a barbershop and a car insurer, and the staff
# purchase request of Corran Group. It is both the
# site's content (what Dushes knows) and its navigation (the only pages, tabs, sections
# and forms the assistant may open). The demo page (frontend/site.html) renders the same file.
title: Main Street
instructions: |
  Aster Bank, Barber & Co and Harbor Insurance are separate businesses: never mix their prices, hours or rules.
  When someone compares loans, point them to the Loans page tab that fits.
pages:
  - path: /
    title: Home
    description: Main Street, the local services portal. Loans from Aster Bank and haircuts at Barber & Co.
    sections:
      - id: welcome
        title: Welcome to Main Street
        text: Main Street brings two local businesses to one place. Aster Bank lends for cars, homes and everyday needs. Barber & Co cuts hair and trims beards. Ask the assistant anything about either one, or tell it what you want to do and it takes you there.
      - id: services
        title: What you can do here
        text: Compare Aster Bank's loans on the Loans page and apply online on the Apply for a loan page. See Barber & Co's services and prices on the Barbershop page and book a visit on the Book a visit page. Opening hours and addresses are on the Contacts page; common questions on the FAQ page.

  - path: /loans
    title: Loans
    keywords: [car loan, mortgage, cash loan, interest rate]
    description: Aster Bank's car loans, mortgages and cash loans, with rates and terms.
    tabs:
      - id: car
        title: Car loan
        text: A car loan from 18.9% a year, for up to 7 years, from 300 000 to 5 000 000. The car is the collateral. A used car must be at most 10 years old at the end of the loan and needs an independent valuation.
      - id: mortgage
        title: Mortgage
        text: A mortgage from 16.5% a year, for up to 30 years. The down payment is at least 20% of the price; families with two or more children under 18 can pay 15%. If you are married without a prenuptial agreement, your spouse joins as a co-borrower.
      - id: cash
        title: Cash loan
        text: A cash loan from 21.9% a year, for up to 5 years, up to 3 000 000 without collateral. Above 3 000 000 you need proof of income.
    sections:
      - id: discounts
        title: Rate discounts
        text: Your rate goes 1 point down if your salary is paid into an Aster Bank account, and 2 points down with life insurance on a consumer loan. The rate never goes below 14.9%. Early repayment, in part or in full, is free.
      - id: documents
        title: Documents you need
        text: A passport for every loan. Employees bring a 2-NDFL tax certificate or the bank's income form; sole proprietors bring last year's tax return; pensioners a pension certificate. A car loan also needs the car's papers; a mortgage the property's papers.

  - path: /apply
    title: Apply for a loan
    keywords: [apply, application, loan application]
    description: Aster Bank's online loan application, with the assistant filling it in with you.
    form: loan_application
    sections:
      - id: how
        title: How applying works
        text: Fill in the application tab by tab; the assistant can fill fields from what you tell it or from a photo of your passport. The bank answers within one working day by SMS.

  - path: /barbershop
    title: Barbershop
    keywords: [barbers, prices, price list]
    description: Barber & Co's services, barbers and prices.
    tabs:
      - id: services
        title: Services and prices
        text: Haircut, 30 minutes, $40. Beard trim, 20 minutes, $25. Haircut and beard, 50 minutes, $60. Kids haircut, 25 minutes, $25. Maria is our senior barber; her prices are 20% higher.
      - id: barbers
        title: Our barbers
        text: Alex and Ivan cut hair; Ivan and Omar trim beards; only Ivan does haircut and beard together. Maria does haircuts and is the only one who cuts kids' hair.
    sections:
      - id: first-visit
        title: First visit
        text: First-time clients get 10% off, applied at the salon.

  - path: /book
    title: Book a visit
    keywords: [haircut, beard, barber, book, booking, appointment, visit]
    description: Book a haircut or beard trim at Barber & Co.
    form: barber_booking
    sections:
      - id: policy
        title: Cancellation policy
        text: Cancel for free up to 2 hours before your visit; a later cancellation costs 50% of the price.

  - path: /insurance
    title: Car insurance
    keywords: [car insurance, insurance, cover, premium, policy, deductible, claim]
    description: Harbor Insurance's car cover, what it costs and how to make a claim.
    tabs:
      - id: levels
        title: Cover levels
        text: Third-party liability from 300 € a year. Standard (liability, theft and fire) from 600 € a year. Full (everything, including damage to your own car) from 900 € a year, only for cars up to 10 years old.
      - id: premium
        title: How the premium is set
        text: Drivers under 21 pay 40% more; at-fault accidents in the last 3 years add 25% (one) or 60% (two); business use adds 20%. A 500 € deductible takes 5% off and a 1000 € deductible 10%. Roadside assistance costs 40 € a year and is free with a Tesla.
    sections:
      - id: claims
        title: Making a claim
        text: Report a claim within 7 days on 8 800 700 80 90. Repairs at partner garages are paid directly.

  - path: /insure
    title: Get a car insurance quote
    keywords: [insure, quote, insurance application, insure my car]
    description: Harbor Insurance's online application, with the assistant filling it in with you.
    form: car_insurance
    sections:
      - id: how
        title: How it works
        text: Describe your car, the driver and the cover you want; the premium is calculated as you go. Cover can start today or within the next 60 days.

  - path: /procurement
    title: Purchase request
    keywords: [purchase, purchase request, procurement, buy, order, supplier, quote, approval, cost centre]
    description: Corran Group's internal purchase request for staff, with the purchasing policy and its FAQ.
    form: procurement_request
    sections:
      - id: policy
        title: Purchasing policy
        text: Every purchase needs a request with a cost centre; the cost centre decides the budget owner, who approves it. Above 5,000 EUR, excluding VAT, a second approver from Finance, Operations or Procurement must approve as well. Above 25,000 EUR, excluding VAT, attach three written quotes from different suppliers. Thresholds apply to the whole request, so splitting one purchase into smaller requests is not allowed.
      - id: suppliers
        title: Suppliers
        text: Buy from a supplier on our list when one offers what you need. A new supplier is checked by Procurement before the first order; give its legal name, VAT number, IBAN, bank and a contact email.
      - id: conflict
        title: Conflict of interest
        text: Declare any personal or financial link between you or a close relative and the supplier, such as ownership, employment or a family tie. A declared link does not stop the request; Procurement decides how it is handled. Not declaring one is a breach of the code of conduct.
      - id: delivery
        title: Delivery
        text: Deliveries go to head office or the warehouse unless you give another address. Suppliers need at least five days, so pick a date at least five days ahead.
    accordions:
      - id: faq-approval
        title: How long does approval take?
        text: The budget owner answers within two working days. A second approver adds up to two more working days.
      - id: faq-vat
        title: Which VAT rate do I choose?
        text: Most goods and services are 21%. Books, food and some medical goods are 9%. Training by an accredited provider is 0%. If unsure, choose 21%; Finance corrects it on the invoice.
      - id: faq-urgent
        title: What if the purchase is urgent?
        text: Make the request anyway and say why it is urgent in the justification. There is no faster route around the approvals.
      - id: faq-card
        title: Can I pay with a company card instead?
        text: Only below 500 EUR, excluding VAT, and only from a known supplier. Anything else needs a purchase request.

  - path: /faq
    title: FAQ
    keywords: [questions, cancel a booking, my data]
    description: Common questions about loans, bookings and your data.
    accordions:
      - id: approval
        title: How fast does the bank decide?
        text: Aster Bank answers a loan application within one working day, by SMS.
      - id: early
        title: Can I repay a loan early?
        text: Yes, in part or in full, at no charge.
      - id: cancel
        title: How do I cancel a barbershop booking?
        text: Call Barber & Co or reply to the confirmation SMS. Free up to 2 hours before the visit, 50% of the price later.
      - id: pay
        title: How do I pay at the barbershop?
        text: Card or cash at the salon. Nothing is charged when you book.
      - id: data
        title: What happens to my data?
        text: Your answers go only to the business whose form you fill in. The assistant never sees values you mark as private, and it shows every value before it fills it in.

  - path: /contacts
    title: Contacts
    keywords: [opening hours, open, hours, address, phone, branch]
    description: Opening hours, addresses and phones of Aster Bank, Barber & Co and Harbor Insurance.
    sections:
      - id: bank
        title: Aster Bank, Main Street branch
        text: 12 Main Street. Monday to Friday 9:00 to 19:00, Saturday 10:00 to 16:00, closed on Sunday. Phone 8 800 100 20 30.
      - id: barber
        title: Barber & Co
        text: 21 Main Street. Monday to Saturday 10:00 to 19:00, closed on Sunday. Phone 8 800 400 50 60.
      - id: insurer
        title: Harbor Insurance
        text: 30 Main Street. Monday to Friday 9:00 to 18:00. Phone 8 800 700 80 90, and a 24-hour line for accidents.
